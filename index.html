<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <style>

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 20px;
      color: #555;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .price-btn {
      padding: 14px 24px;
      border: 2px solid black;
      border-radius: 8px;
      background: white;
      color: black;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .price-btn.active {
      background: black;
      color: white;
    }

    #sendBtn {
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      background: black;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    .box {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      width: 100%;
      max-width: 600px;
      border: 1px solid #ddd;
      box-sizing: border-box;
      word-break: break-word;
    }

  </style>
</head>

<body>

  <h2>Hosted iframe</h2>

  <p>
    Select a price and send payload to Shopify
  </p>

  <!-- PRICE BUTTONS -->
  <div class="button-group">

    <button
      class="price-btn"
      data-price="10"
    >
      $10
    </button>

    <button
      class="price-btn"
      data-price="20"
    >
      $20
    </button>

    <button
      class="price-btn"
      data-price="30"
    >
      $30
    </button>

  </div>

  <!-- SELECTED VALUE -->
  <div class="box">
    <strong>Selected Price:</strong>

    <div id="selectedPriceBox">
      Nothing Selected
    </div>
  </div>

  <!-- PARENT URL -->
  <div class="box">
    <strong>Parent URL:</strong>

    <div id="parentUrlBox">
      Loading...
    </div>
  </div>

  <!-- SHOP -->
  <div class="box">
    <strong>Shop Name:</strong>

    <div id="shopBox">
      Waiting...
    </div>
  </div>

  <!-- SEND BUTTON -->
  <button id="sendBtn">
    Send Data To Parent
  </button>

  <script>

    // ============================================
    // CONFIG STATE
    // ============================================

    let selectedPrice = null;

    // ============================================
    // GET PARENT URL
    // ============================================

    const parentUrl = document.referrer;

    document.getElementById(
      "parentUrlBox"
    ).innerText = parentUrl || "No Referrer Found";

    // ============================================
    // RECEIVE SHOP DATA
    // ============================================

    let parentShop = null;

    window.addEventListener("message", function(event) {

      const data = event.data;

      console.log("Received Data:", data);

      if (data.type === "SHOP_DATA") {

        parentShop = data.shop;

        document.getElementById(
          "shopBox"
        ).innerText = parentShop;

      }

    });

    // ============================================
    // PRICE BUTTON LOGIC
    // ============================================

    const priceButtons = document.querySelectorAll(".price-btn");

    priceButtons.forEach((button) => {

      button.addEventListener("click", function() {

        // REMOVE ACTIVE STATE
        priceButtons.forEach((btn) => {
          btn.classList.remove("active");
        });

        // ADD ACTIVE STATE
        this.classList.add("active");

        // STORE VALUE
        selectedPrice = Number(
          this.dataset.price
        );

        console.log(
          "Selected Price:",
          selectedPrice
        );

        // UPDATE UI
        document.getElementById(
          "selectedPriceBox"
        ).innerText =
          "$" + selectedPrice;

      });

    });

    // ============================================
    // SEND DATA TO SHOPIFY
    // ============================================

    const variantId = 53732486087022;

    document
      .getElementById("sendBtn")
      .addEventListener("click", function() {

        // VALIDATION

        if (!selectedPrice) {

          alert("Please select a price");

          return;

        }

        // FINAL PAYLOAD

        const payload = {

          type: "ADD_TO_CART",

          variantId: variantId,

          configuration: {

            selectedPrice: selectedPrice

          },

          parentUrl: parentUrl,

          shop: parentShop

        };

        console.log(
          "Sending Payload:",
          payload
        );

        // SEND TO SHOPIFY PARENT

        window.parent.postMessage(
          payload,
          "https://test-store-django-ani.myshopify.com"
        );

      });

  </script>

</body>
</html>
