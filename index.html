<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <style>

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 20px;
      color: #555;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      background: black;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .box {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      width: 100%;
      max-width: 600px;
      border: 1px solid #ddd;
      box-sizing: border-box;
      word-break: break-word;
    }

  </style>
</head>

<body>

  <h2>Hosted iframe</h2>

  <p>
    iframe ↔ Shopify communication
  </p>

  <!-- DISPLAY PARENT URL -->
  <div class="box">
    <strong>Parent URL:</strong>

    <div id="parentUrlBox">
      Loading...
    </div>
  </div>

  <!-- DISPLAY SHOP -->
  <div class="box">
    <strong>Shop Name:</strong>

    <div id="shopBox">
      Waiting...
    </div>
  </div>

  <!-- BUTTON -->
  <button id="sendBtn">
    Send Data To Parent
  </button>

  <script>

    // ============================================
    // GET PARENT URL FROM REFERRER
    // ============================================

    const parentUrl = document.referrer;

    console.log("Parent URL:", parentUrl);

    document.getElementById(
      "parentUrlBox"
    ).innerText = parentUrl || "No Referrer Found";

    // ============================================
    // STORE SHOP DATA FROM PARENT
    // ============================================

    let parentShop = null;

    // ============================================
    // RECEIVE DATA FROM SHOPIFY PARENT
    // ============================================

    window.addEventListener("message", function(event) {

      console.log("Received Event:", event);

      // OPTIONAL SECURITY CHECK

      /*
      if (
        event.origin !==
        "https://test-store-django-ani.myshopify.com"
      ) {
        return;
      }
      */

      const data = event.data;

      console.log("Received Data:", data);

      // ============================================
      // RECEIVE SHOP DATA
      // ============================================

      if (data.type === "SHOP_DATA") {

        parentShop = data.shop;

        console.log("Shop Received:", parentShop);

        document.getElementById(
          "shopBox"
        ).innerText = parentShop;

      }

    });

    // ============================================
    // SEND DATA BACK TO SHOPIFY
    // ============================================

    const variantId = 53732486087022;

    document
      .getElementById("sendBtn")
      .addEventListener("click", function() {

        const payload = {

          type: "ADD_TO_CART",

          variantId: variantId,

          parentUrl: parentUrl,

          shop: parentShop

        };
        console.log("shop_name:", parentShop);
        console.log("Sending:", payload);

        window.parent.postMessage(
          payload,
          "https://test-store-django-ani.myshopify.com"
        );

      });

  </script>

</body>
</html>
