<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <style>

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 20px;
      color: #555;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      background: black;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

  </style>
</head>

<body>

  <h2>Hosted iframe</h2>

  <p>
    Click button to send variant to Shopify
  </p>

  <button id="sendBtn">
    Send Data To Parent
  </button>

  <script>

    const variantId = 53732486087022;

    document
      .getElementById("sendBtn")
      .addEventListener("click", function() {

        const payload = {
          type: "ADD_TO_CART",
          variantId: variantId
        };

        console.log("Sending:", payload);

        window.parent.postMessage(payload, "https://test-store-django-ani.myshopify.com");

      });

  </script>

</body>
</html>
