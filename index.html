<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="configurator" aria-labelledby="configuratorTitle">
    <section class="panel">
      <div class="panel-header">
        <p class="eyebrow">Custom bridal ring</p>
        <h1 id="configuratorTitle">Choose your options</h1>
      </div>

      <fieldset class="option-section">
        <legend>Diamond Shape</legend>

        <div class="option-grid" id="diamondShapeOptions">
          <button class="option-card" type="button" data-option-group="diamondShape" data-label="Diamond Shape"
            data-value="Round" data-price="8">
            <span class="shape-icon shape-round" aria-hidden="true"></span>
            <span class="option-name">Round</span>
            <span class="option-price">+$8</span>
          </button>

          <button class="option-card" type="button" data-option-group="diamondShape" data-label="Diamond Shape"
            data-value="Square" data-price="5">
            <span class="shape-icon shape-square" aria-hidden="true"></span>
            <span class="option-name">Square</span>
            <span class="option-price">+$5</span>
          </button>

          <button class="option-card" type="button" data-option-group="diamondShape" data-label="Diamond Shape"
            data-value="Oval" data-price="12">
            <span class="shape-icon shape-oval" aria-hidden="true"></span>
            <span class="option-name">Oval</span>
            <span class="option-price">+$12</span>
          </button>

          <button class="option-card" type="button" data-option-group="diamondShape" data-label="Diamond Shape"
            data-value="Pear" data-price="15">
            <span class="shape-icon shape-pear" aria-hidden="true"></span>
            <span class="option-name">Pear</span>
            <span class="option-price">+$15</span>
          </button>
        </div>
      </fieldset>

      <fieldset class="option-section">
        <legend>Ring Size</legend>

        <div class="size-grid" id="ringSizeOptions">
          <button class="option-card size-card" type="button" data-option-group="ringSize" data-label="Ring Size"
            data-value="6" data-price="10">
            <span class="option-name">6</span>
            <span class="option-price">+$10</span>
          </button>

          <button class="option-card size-card" type="button" data-option-group="ringSize" data-label="Ring Size"
            data-value="7" data-price="12">
            <span class="option-name">7</span>
            <span class="option-price">+$12</span>
          </button>

          <button class="option-card size-card" type="button" data-option-group="ringSize" data-label="Ring Size"
            data-value="8" data-price="14">
            <span class="option-name">8</span>
            <span class="option-price">+$14</span>
          </button>

          <button class="option-card size-card" type="button" data-option-group="ringSize" data-label="Ring Size"
            data-value="9" data-price="16">
            <span class="option-name">9</span>
            <span class="option-price">+$16</span>
          </button>

          <button class="option-card size-card" type="button" data-option-group="ringSize" data-label="Ring Size"
            data-value="10" data-price="18">
            <span class="option-name">10</span>
            <span class="option-price">+$18</span>
          </button>
        </div>
      </fieldset>

      <aside class="summary" aria-live="polite">
        <div class="summary-row">
          <span>Selected Options</span>
          <strong id="selectedOptionsBox">Choose diamond shape and ring size</strong>
        </div>

        <div class="summary-row total-row">
          <span>Total Variant Price</span>
          <strong id="selectedPriceBox">$0.00</strong>
        </div>
      </aside>

      <button id="sendBtn" class="primary-button" type="button">
        Add to Cart
      </button>
    </section>
  </main>

  <script>
    // ============================================
    // CONFIG STATE
    // ============================================

    const selectedOptions = {
      diamondShape: null,
      ringSize: null,
    };

    const skuShapeOrder = ["Round", "Square", "Oval", "Pear"];
    const skuSizeOrder = ["6", "7", "8", "9", "10"];

    let parentShop = null;
    let isLoading = false;

    function getSelectedPrice() {
      return Object.values(selectedOptions).reduce((total, option) => {
        return total + (option ? option.price : 0);
      }, 0);
    }

    function getLineItems() {
      return Object.values(selectedOptions)
        .filter(Boolean)
        .map((option) => ({
          name: option.label,
          value: option.value,
          price: option.price.toFixed(2),
          label: `${option.label}: ${option.value}`,
        }));
    }

    function getSelectedSku() {
      if (!selectedOptions.diamondShape || !selectedOptions.ringSize) {
        return null;
      }

      const shapeIndex = skuShapeOrder.indexOf(selectedOptions.diamondShape.value);
      const sizeIndex = skuSizeOrder.indexOf(selectedOptions.ringSize.value);

      if (shapeIndex === -1 || sizeIndex === -1) {
        return null;
      }

      return String((shapeIndex + 1) * 1000 + sizeIndex + 1);
    }

    function updateSummary() {
      const selectedPrice = getSelectedPrice();
      const lineItems = getLineItems();
      const selectedOptionsBox = document.getElementById("selectedOptionsBox");

      selectedOptionsBox.innerText = lineItems.length
        ? lineItems.map((item) => item.label).join(", ")
        : "Choose diamond shape and ring size";

      document.getElementById("selectedPriceBox").innerText =
        "$" + selectedPrice.toFixed(2);
    }

    // ============================================
    // RECEIVE SHOP DATA FROM PARENT
    // ============================================

    window.addEventListener("message", function (event) {
      const data = event.data;

      console.log("Received Data:", data);

      if (data.type === "SHOP_DATA") {
        parentShop = data.shop;
      }
    });

    // ============================================
    // OPTION BUTTONS
    // ============================================

    const optionButtons = document.querySelectorAll(".option-card");

    optionButtons.forEach((button) => {
      button.addEventListener("click", function () {
        const optionGroup = this.dataset.optionGroup;

        document
          .querySelectorAll(`[data-option-group="${optionGroup}"]`)
          .forEach((btn) => {
            btn.classList.remove("active");
            btn.setAttribute("aria-pressed", "false");
          });

        this.classList.add("active");
        this.setAttribute("aria-pressed", "true");

        selectedOptions[optionGroup] = {
          label: this.dataset.label,
          value: this.dataset.value,
          price: Number(this.dataset.price),
        };

        updateSummary();
      });

      button.setAttribute("aria-pressed", "false");
    });

    // ============================================
    // SEND BUTTON
    // ============================================

    document
      .getElementById("sendBtn")
      .addEventListener("click", async function () {
        const selectedPrice = getSelectedPrice();
        const lineItems = getLineItems();
        const selectedSku = getSelectedSku();
        console.log("SKU ", selectedSku)
        if (!selectedOptions.diamondShape || !selectedOptions.ringSize) {
          alert("Please select diamond shape and ring size");

          return;
        }

        if (!parentShop) {
          alert("Shop data not received yet");

          return;
        }

        if (isLoading) return;

        isLoading = true;

        const sendBtn = document.getElementById("sendBtn");

        sendBtn.disabled = true;
        sendBtn.innerText = "Add to Cart";

        try {
          // ============================================
          // API REQUEST BODY
          // ============================================

          const requestBody = {
            shop: parentShop,

            sku: selectedSku,

            price: selectedPrice.toFixed(2),

            lineItems: lineItems,
          };

          console.log("Sending API Request:", requestBody);

          // ============================================
          // CALL API
          // ============================================

          const response = await fetch(
            "https://neuter-blustery-hefty.ngrok-free.dev/api/products/bridal",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(requestBody),
            },
          );

          if (!response.ok) {
            throw new Error("API Request Failed");
          }

          // ============================================
          // API RESPONSE
          // ============================================

          const result = await response.json();

          console.log("API Response:", result);

          // ============================================
          // EXTRACT VARIANT ID
          // ============================================

          const fullVariantId = result.variant_id;

          // gid://shopify/ProductVariant/53741530055022

          const variantId = fullVariantId.split("/").pop();

          console.log("Extracted Variant ID:", variantId);

          // ============================================
          // FINAL PAYLOAD
          // ============================================

          const payload = {
            type: "ADD_TO_CART",

            variantId: Number(variantId),

            lineItems: lineItems,

            configuration: {
              sku: selectedSku,
              selectedPrice: selectedPrice,
              selectedPriceFormatted: selectedPrice.toFixed(2),
              diamondShape: selectedOptions.diamondShape.value,
              ringSize: selectedOptions.ringSize.value,
            },

            shop: parentShop,
          };

          console.log("Sending Payload:", payload);

          // ============================================
          // SEND TO SHOPIFY PARENT
          // ============================================

          window.parent.postMessage(
            payload,
            "https://test-store-django-ani.myshopify.com",
          );
        } catch (error) {
          console.error(error);

          alert("Failed To Generate Variant");
        } finally {
          isLoading = false;

          setTimeout(() => {
            sendBtn.disabled = false;

            sendBtn.innerText = "Add to Cart";
          }, 2000);
        }
      });
  </script>
</body>

</html>
